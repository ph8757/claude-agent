name: Naver Stock Agent Automation

on:
  schedule:
    # 1. 월~금 아침 08:30 KST ➔ UTC 기준 전날 밤 23:30 (일~목요일 밤 지정을 위해 0-4 설정)
    - cron: '30 23 * * 0-4'
    
    # 2. 월~금 오후 15:40 KST ➔ UTC 기준 당일 오전 06:40
    - cron: '40 6 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 활성화용

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: レ포지토리 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 anthropic python-dotenv

    - name: 에이전트 스크립트 실행
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        ADDITIONAL_RECEIVERS: ${{ secrets.ADDITIONAL_RECEIVERS }}
      run: |
        # python naver_stock_agent.py
